<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poolish.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --white: #F9F7F5;
    --black: #111110;
    --mid: #888;
    --rule: #e0ddd9;
  }

  body {
    background: var(--white);
    color: var(--black);
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
  }

  /* LEFT SIDEBAR */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    border-right: 1px solid var(--rule);
    display: flex;
    flex-direction: column;
    padding: 1.5rem 1.5rem;
    min-height: 100vh;
  }

  .sidebar-logo {
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    color: var(--black);
    text-decoration: none;
    margin-bottom: 1.2rem;
    display: block;
  }

  .sidebar img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    margin-bottom: 1.8rem;
  }

  .sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .sidebar nav a {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #6B35FF;
    text-decoration: none;
    padding: 0.6rem 0;
    border-top: 1px solid var(--rule);
    transition: color 0.15s;
  }

  .sidebar nav a:last-child {
    border-bottom: 1px solid var(--rule);
  }

  .sidebar nav a:hover { color: var(--black); }

  /* MAIN CONTENT */
  .main {
    flex: 1;
    padding: 2.5rem 3rem;
    max-width: 600px;
  }

  .main p {
    font-size: 0.9rem;
    line-height: 1.9;
    color: var(--mid);
    letter-spacing: 0.02em;
  }

  .main p + p {
    margin-top: 1.2rem;
  }

  /* MOBILE */
  @media (max-width: 400px) {
    body { flex-direction: column; }

    .sidebar {
      width: 100%;
      min-height: auto;
      border-right: none;
      border-bottom: 1px solid var(--rule);
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
    }

    .sidebar img {
      width: 48px;
      aspect-ratio: 1;
      margin-bottom: 0;
    }

    .sidebar-logo { margin-bottom: 0; }

    .sidebar nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.4rem 1.2rem;
    }

    .sidebar nav a {
      border: none;
      padding: 0;
    }

    .sidebar nav a:last-child { border: none; }

    .main { padding: 1.5rem; }
  }
</style>
</head>
